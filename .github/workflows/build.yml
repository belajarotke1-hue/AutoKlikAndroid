name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Buat Manifest Otomatis
        run: |
          python3 -c '
          attr = "android:" + "name"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">
              <uses-permission {attr}="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:label="AutoKlik Jadwal"
                  android:theme="@style/Theme.MaterialComponents.DayNight.DarkActionBar"
                  tools:replace="android:allowBackup,android:label,android:theme">
                  <activity {attr}="com.custom.autoklik.MainActivity" android:exported="true">
                      <intent-filter>
                          <action {attr}="android.intent.action.MAIN" />
                          <category {attr}="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service {attr}="com.custom.autoklik.AutoClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action {attr}="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data {attr}="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Generate Gradle Wrapper & Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoKlik-APK
          path: app/build/outputs/apk/debug/app-debug.apk
